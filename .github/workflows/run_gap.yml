name: Run GAP
# The playground finds its run by this title, so keep the "GAP " prefix
# (it is used for every tool, including Prover9 and Mace4).
run-name: GAP ${{ github.event.client_payload.run_id }}

on:
  repository_dispatch:
    types: [run_gap]

permissions:
  contents: read

jobs:
  run-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Official GAP image with every deposited package compiled
      # (Semigroups, Digraphs, GRAPE, AtlasRep, ...). Change the tag to update GAP.
      GAP_IMAGE: ghcr.io/gap-system/gap:4.15.1-full
      # Prover9 and Mace4 (LADR) are built from this modernized commit and cached.
      # To update them, change the commit (and bump "v2" in the cache keys below).
      LADR_REPO: AlgorithmicTruth/Prover9
      LADR_COMMIT: 62ae6ff62fbe85b12c69d8625db1d358973c3d2f
      # Passed via env (never interpolated into shell) so user input can't inject commands.
      CODE_B64: ${{ github.event.client_payload.code_b64 }}
      RUN_ID: ${{ github.event.client_payload.run_id }}
      TOOL_IN: ${{ github.event.client_payload.tool }}
    steps:
      - name: Validate payload
        run: |
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]{6,64}$ ]] || { echo "Invalid run_id"; exit 1; }
          [[ -n "$CODE_B64" ]] || { echo "Empty code payload"; exit 1; }
          # Older versions of the page send no tool, which means GAP.
          TOOL="${TOOL_IN:-gap}"
          case "$TOOL" in
            gap|prover9|mace4|lean) ;;
            *) echo "Unknown tool"; exit 1 ;;
          esac
          echo "TOOL=$TOOL" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # GAP
      # ------------------------------------------------------------------
      - name: Pull GAP (full bundle)
        if: env.TOOL == 'gap'
        run: docker pull "$GAP_IMAGE"

      # The image ships Semigroups without its compiled kernel module, so it
      # can't load. Compile it once here and cache the result for later runs.
      - name: Restore compiled Semigroups
        id: sgcache
        if: env.TOOL == 'gap'
        uses: actions/cache/restore@v4
        with:
          path: sg-built
          key: semigroups-built-v1-${{ env.GAP_IMAGE }}

      - name: Build Semigroups (first run only)
        id: sgbuild
        if: env.TOOL == 'gap' && steps.sgcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p sg-built && chmod 777 sg-built
          cat > build-sg.sh <<'EOF'
          set -e
          echo 'Print(GAPInfo.PackagesInfo.semigroups[1].InstallationPath);QUIT;' > /tmp/p.g
          PKG=$(gap -q -b /tmp/p.g < /dev/null 2>&1 | tr -d '\r' | tail -n 1) || true
          echo "GAP reports package dir: [$PKG]"
          if [ ! -d "$PKG" ]; then
            echo "Not a directory; searching the filesystem instead:"
            find / -iname "*semigroups*" -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | head -n 40
            PKG=$(find / -type d -iname "semigroups*" -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | grep -i pkg | head -n 1)
          fi
          echo "Using package dir: [$PKG]"
          [ -d "$PKG" ] || { echo "Could not find the Semigroups package folder"; exit 1; }
          ls "$PKG" | head -n 30
          apt-get update -qq
          apt-get install -y -qq build-essential autoconf automake libtool pkg-config
          cd "$PKG"
          ./configure
          make -j"$(nproc)"
          mkdir -p /out/pkg
          cp -a "$PKG/." /out/pkg/
          echo "$PKG" > /out/path
          chmod -R a+rX /out
          EOF
          docker run --rm --user root -v "$PWD/sg-built:/out" -v "$PWD/build-sg.sh:/build-sg.sh:ro" \
            --entrypoint bash "$GAP_IMAGE" /build-sg.sh

      - name: Save compiled Semigroups
        if: steps.sgbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: sg-built
          key: semigroups-built-v1-${{ env.GAP_IMAGE }}

      - name: Prepare input (GAP)
        if: env.TOOL == 'gap'
        run: |
          mkdir work
          echo "$CODE_B64" | base64 -d > work/user.g
          cat > work/helper.g <<'EOF'
          # Helper for the playground: Tex(obj) prints obj as a display equation.
          Tex := function(x)
            local s;
            if IsBoundGlobal("LaTeXObj") then s := ValueGlobal("LaTeXObj")(x);
            elif IsBoundGlobal("LaTeX") then s := ValueGlobal("LaTeX")(x);
            else s := String(x); fi;
            Print("$$", s, "$$\n");
          end;;
          EOF
          printf '\n' >> work/user.g
          chmod -R a+rX work

      - name: Run GAP (sandboxed)
        if: env.TOOL == 'gap'
        run: |
          set +e
          EXTRA=()
          if [ -f sg-built/path ]; then
            EXTRA=(-v "$PWD/sg-built/pkg:$(cat sg-built/path):ro")
          fi
          # Code is fed on stdin, so GAP behaves like the interactive prompt
          # and prints the value of every statement that ends in a single ';'.
          timeout 120 docker run -i --rm --network none --memory 3g --pids-limit 512 \
            -v "$PWD/work:/work:ro" "${EXTRA[@]}" --entrypoint gap "$GAP_IMAGE" \
            -q -b -o 2g /work/helper.g < work/user.g 2>&1 \
            | sed -u 's/\x1b\[[0-9;]*m//g' > output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 124 ]; then echo "" >> output.txt; echo "[Stopped: time limit of 120 s reached]" >> output.txt; fi
          head -c 1000000 output.txt > output.tmp && mv output.tmp output.txt
          exit 0

      # ------------------------------------------------------------------
      # Prover9 and Mace4
      # Ubuntu 24.04 only packages the Prover9 manual, not the programs, so
      # they are compiled once from a pinned commit and cached (seconds to
      # build, no extra packages needed).
      # ------------------------------------------------------------------
      - name: Restore compiled Prover9 and Mace4
        id: ladrcache
        if: env.TOOL == 'prover9' || env.TOOL == 'mace4'
        uses: actions/cache/restore@v4
        with:
          path: ladr-bin
          key: ladr-bin-v2-${{ env.LADR_COMMIT }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build Prover9 and Mace4 (first run only)
        id: ladrbuild
        if: (env.TOOL == 'prover9' || env.TOOL == 'mace4') && steps.ladrcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
          rm -rf ladr-src
          git clone --depth 1 "https://github.com/$LADR_REPO.git" ladr-src
          cd ladr-src
          git checkout -q "$LADR_COMMIT" || true
          mkdir -p bin
          make all -j"$(nproc)" XFLAGS="-O2 -std=gnu89 -fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-incompatible-pointer-types" 2>&1 | tee ../ladr-build.log
          cd ..
          mkdir -p ladr-bin
          cp ladr-src/bin/prover9 ladr-src/bin/mace4 ladr-bin/
          chmod +x ladr-bin/prover9 ladr-bin/mace4
          # Smoke test: x = x must be proved.
          printf 'formulas(goals).\n  x = x.\nend_of_list.\n' | ladr-bin/prover9 | grep -a 'THEOREM PROVED'

      - name: Save compiled Prover9 and Mace4
        if: steps.ladrbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ladr-bin
          key: ladr-bin-v2-${{ env.LADR_COMMIT }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare input (Prover9 / Mace4)
        if: env.TOOL == 'prover9' || env.TOOL == 'mace4'
        run: |
          mkdir work
          echo "$CODE_B64" | base64 -d > work/input.in
          printf '\n' >> work/input.in
          chmod -R a+rX work

      - name: Run Prover9 / Mace4 (sandboxed)
        if: env.TOOL == 'prover9' || env.TOOL == 'mace4'
        run: |
          set +e
          BIN="$PWD/ladr-bin/$TOOL"
          if [ ! -x "$BIN" ]; then
            echo "[$TOOL is not available because building it failed. Open this run's log on GitHub for details.]" > output.txt
            if [ -f ladr-build.log ]; then
              echo "" >> output.txt
              echo "--- Build Log ---" >> output.txt
              tail -n 60 ladr-build.log >> output.txt
            fi
            exit 0
          fi
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
            timeout -k 5 120 \
            prlimit --as=3221225472 -- \
            "$BIN" -t 100 -f work/input.in 2>&1 \
            | sed -u 's/\x1b\[[0-9;]*m//g; s/\x07//g' > output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 124 ]; then echo "" >> output.txt; echo "[Stopped: time limit of 120 s reached]" >> output.txt; fi
          head -c 1000000 output.txt > output.tmp && mv output.tmp output.txt
          exit 0

      # ------------------------------------------------------------------
      # Lean 4 & Mathlib 4
      # Toolchain and prebuilt Mathlib olean caches are downloaded and kept
      # in GitHub Actions cache for instant subsequent runs.
      # ------------------------------------------------------------------
      - name: Cache Lean 4 toolchain and Mathlib
        id: leancache
        if: env.TOOL == 'lean'
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean-project
          key: lean4-mathlib-v2-4.15.0-${{ runner.os }}

      - name: Setup Lean 4 & Mathlib 4 (first run only)
        if: env.TOOL == 'lean' && steps.leancache.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
          export PATH="$HOME/.elan/bin:$PATH"
          elan default leanprover/lean4:v4.15.0
          mkdir -p lean-project
          echo "leanprover/lean4:v4.15.0" > lean-project/lean-toolchain
          cat > lean-project/lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «playground»

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.15.0"
          EOF
          cd lean-project
          lake update
          lake exe cache get || true
          cd ..

      - name: Prepare input (Lean 4)
        if: env.TOOL == 'lean'
        run: |
          mkdir -p lean-project/work
          echo "leanprover/lean4:v4.15.0" > lean-project/lean-toolchain
          if [ ! -f lean-project/lakefile.lean ]; then
            cat > lean-project/lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «playground»

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @ "v4.15.0"
          EOF
          fi
          echo "$CODE_B64" | base64 -d > lean-project/work/UserCode.lean
          printf '\n' >> lean-project/work/UserCode.lean

      - name: Run Lean 4 (sandboxed)
        if: env.TOOL == 'lean'
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
          fi
          # Ensure default toolchain is explicitly configured in elan settings
          elan default leanprover/lean4:v4.15.0 2>/dev/null || elan default stable 2>/dev/null || true
          cd lean-project
          echo "leanprover/lean4:v4.15.0" > lean-toolchain
          elan override set leanprover/lean4:v4.15.0 2>/dev/null || elan override set stable 2>/dev/null || true
          timeout 120 lake env lean work/UserCode.lean 2>&1 | sed -u 's/\x1b\[[0-9;]*m//g' > ../output.txt
          code=${PIPESTATUS[0]}
          if grep -q "no default toolchain configured" ../output.txt 2>/dev/null; then
            echo "Configuring elan default stable..."
            elan default stable
            timeout 120 lake env lean work/UserCode.lean 2>&1 | sed -u 's/\x1b\[[0-9;]*m//g' > ../output.txt
            code=${PIPESTATUS[0]}
          fi
          cd ..
          if [ ! -s output.txt ] && [ "$code" -eq 0 ]; then
            echo "All goals accomplished. No errors found." > output.txt
          fi
          if [ "$code" -eq 124 ]; then echo "" >> output.txt; echo "[Stopped: time limit of 120 s reached]" >> output.txt; fi
          head -c 1000000 output.txt > output.tmp && mv output.tmp output.txt
          exit 0

      # ------------------------------------------------------------------
      # Shared: publish the result
      # ------------------------------------------------------------------
      # Fallback channel: the page can read this annotation through the API
      # if the browser is blocked from downloading the artifact zip.
      - name: Publish output annotation
        run: |
          python3 - <<'PY'
          d = open('output.txt', 'rb').read()[:60000].decode('utf-8', 'ignore')
          if not d.strip():
              d = '(no output)'
          e = d.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=GAP output::{e}")
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-output
          path: output.txt
          retention-days: 1
          if-no-files-found: ignore